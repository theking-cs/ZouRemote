<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ZouRemote</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Bloqueo total de scroll y ajuste a pantalla completa */
        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h2 { margin: 10px 0; color: #38bdf8; font-size: 22px; }

        /* Mando ajustado al ancho de pantalla */
        .remote {
            background: #1e293b;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #334155;
            width: 95%; /* Ocupa casi toda la pantalla */
            max-width: 420px;
            box-sizing: border-box;
        }

        .row {
            margin: 6px 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* Botones que se expanden para llenar el ancho */
        button {
            flex: 1; /* Esto hace que ocupen todo el espacio disponible */
            padding: 15px 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-weight: bold;
            touch-action: manipulation;
            min-height: 50px;
        }

        button:active { background: #475569; transform: scale(0.95); }

        #POWER { background: #be123c !important; flex: 1.5; }
        .ok { background: #0284c7 !important; flex: 1.5; font-size: 20px; }
        
        /* Botones de colores */
        .color-btn { height: 45px; }
        #RED { background: #dc2626 !important; }
        #GREEN { background: #16a34a !important; }
        #YELLOW { background: #ca8a04 !important; color: black; }
        #BLUE { background: #2563eb !important; }

        /* Flechas */
        #UP, #DOWN, #LEFT, #RIGHT {
            background: #1e293b;
            border: 1px solid #475569;
            font-size: 22px;
        }

        .column { display: flex; flex-direction: column; gap: 6px; flex: 1; }

        /* --- BOTÓN SSH QUE OCUPA EL ANCHO --- */
        #BTN_SSH {
            width: 95%;
            max-width: 420px;
            margin-top: 15px;
            background: #000 !important;
            color: #00ff00 !important;
            border: 1px solid #00ff00 !important;
            font-family: monospace;
            font-size: 16px;
            padding: 15px;
            border-radius: 10px;
            flex: none; /* Evita que crezca de más verticalmente */
        }
    </style>
</head>
<body>

    <h2>ZouPlayer Remote</h2>

    <div class="remote">
        <div class="row"><button id="POWER">⏻</button></div>

        <div class="row">
            <button id="RED" class="color-btn">●</button>
            <button id="GREEN" class="color-btn">●</button>
            <button id="YELLOW" class="color-btn">●</button>
            <button id="BLUE" class="color-btn">●</button>
        </div>

        <div class="row"><button id="UP">▲</button></div>
        <div class="row">
            <button id="LEFT">◀</button>
            <button id="OK" class="ok">OK</button>
            <button id="RIGHT">▶</button>
        </div>
        <div class="row"><button id="DOWN">▼</button></div>

        <div class="row">
            <button id="MENU">MENU</button>
            <div class="column">
                <button id="VOL+">+</button>
                <button id="VOL-">-</button>
            </div>
            <div class="column">
                <button id="CH+">P+</button>
                <button id="CH-">P-</button>
            </div>
            <button id="EXIT">EXIT</button>
        </div>

        <div class="row">
            <button id="INFO">INFO</button>
            <button id="EPG">EPG</button>
        </div>
    </div>

    <button id="BTN_SSH">
        &gt;_ CONSOLA SSH
    </button>

    <script src="remote.js"></script>
    <script>
        document.getElementById('BTN_SSH').addEventListener('click', function() {
            window.open('http://' + window.location.hostname + ':1992', '_blank');
        });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
